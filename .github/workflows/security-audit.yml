name: Farol security audit
on:
  push:
    branches:
      - security/v0.14-auth-hardening
      - security/v0.16-legacy-backup-staging
      - security/v0.17-legacy-dry-run
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'backend']
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static security patterns and committed secrets
        if: matrix.directory == '.'
        run: node scripts/security-static-scan.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit high/critical dependencies
        run: npm audit --audit-level=high
      - name: Typecheck frontend
        if: matrix.directory == '.'
        run: npm run typecheck
      - name: Frontend tests
        if: matrix.directory == '.'
        run: npm test
      - name: Backend tests
        if: matrix.directory == 'backend'
        run: npm test

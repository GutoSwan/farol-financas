name: Monitorar API pública do Farol

# Este agendamento só começa quando este arquivo estiver na branch padrão.
# Antes disso a checagem local CI e o disparo por push/PR já testam o código.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-check:
    name: Health + readiness HTTPS
    if: ${{ vars.FAROL_PUBLIC_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Health / ready sem token ou escrita
        env:
          FAROL_PUBLIC_API_BASE_URL: ${{ vars.FAROL_PUBLIC_API_BASE_URL }}
        run: node scripts/verify-public-health.mjs

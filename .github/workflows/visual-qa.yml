name: Testes visuais simulados do Farol

# Testa apenas esta branch e sem conectar a bancos/contas reais.
# Browser intercepta chamadas de Auth/API e usa identidades 100% artificiais.
on:
  push:
    branches:
      - feat/v0.24-superadmin-ux-navigation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farol-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Capturas e navegação desktop/celular
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        run: npm ci --no-audit --no-fund
      - name: Build somente com URLs de teste (sem chaves reais)
        env:
          VITE_SUPABASE_URL: https://tvirkrjkgdtybtcundon.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SYNTHETIC_BROWSER_TEST_NOT_A_REAL_KEY_12345
          VITE_API_BASE_URL: https://qa-api.invalid
          VITE_ENABLE_ONLINE_WORKSPACE_WRITES: 'false'
        run: npm run build
      - name: Instalar Playwright e navegador
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          command -v google-chrome
      - name: Iniciar site isolado sem servidor de dados
        run: |
          nohup ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/farol-qa-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Preview local não iniciou' >&2
          exit 1
      - name: Testar e fotografar as telas com usuário simulado
        env:
          FAROL_CHROMIUM_BIN: /usr/bin/google-chrome
        run: node scripts/visual-smoke.mjs
      - name: Guardar imagens das telas sem dados reais
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farol-visual-qa-simulado
          path: artifacts/visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 7

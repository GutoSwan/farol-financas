name: Gerar lockfiles revisaveis (execucao unica)
on:
  push:
    branches:
      - security/v0.15-audit-20261109
    paths:
      - '.github/workflows/generate-lockfiles-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    if: github.ref == 'refs/heads/security/v0.15-audit-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Criar locks sem executar scripts de pacotes
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd backend && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          test -s package-lock.json
          test -s backend/package-lock.json
      - name: Versionar os lockfiles somente na branch de seguranca
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json backend/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m 'chore(deps): lock npm dependencies for reproducible builds'
            git push origin HEAD:security/v0.15-audit-20261109
          fi

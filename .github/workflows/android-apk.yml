name: Gerar APK Android de teste
on:
  # Android foi adiado: gerar apenas quando solicitado manualmente.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    # Sem essas variáveis públicas, não criamos APK com login desativado.
    if: "${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}"
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "${{ vars.VITE_SUPABASE_URL }}"
      VITE_SUPABASE_PUBLISHABLE_KEY: "${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}"
      VITE_API_BASE_URL: "${{ vars.VITE_API_BASE_URL }}"
      VITE_ENABLE_ONLINE_WORKSPACE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar aplicativo web
        run: npm run build
      - name: Criar projeto Android quando necessario
        run: if [ ! -d android ]; then npx cap add android; fi
      - name: Sincronizar aplicativo Android
        run: npx cap sync android
      - name: Gerar APK com assinatura de teste
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: farol-financas-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Validar Farol Finanças
on:
  push:
    branches:
      - feat/estrutura-base-clean-architecture
      - feat/v0.2-ux-contas-espacos-relatorios
      - feat/v0.3-orcamentos-projetos-cotacoes
      - feat/v0.4-backend-foundation
      - feat/v0.5-auth-frontend-supabase
      - feat/v0.6-email-otp-perfil
      - feat/v0.7-auth-api-espacos-online
      - feat/v0.8-sidebar-fixa-responsiva
      - feat/v0.9-sidebar-limpa-sem-scroll
      - feat/v0.10-menu-completo-mobile-drawer
      - feat/v0.11-tema-claro-preparacao-vercel
      - feat/v0.13-api-postgres-nuvem
      - fix/v0.13-vercel-fastify-entry
      - feat/v0.12-login-redireciona-dashboard
      - fix/v0.13-vercel-fastify-404
      - main
  pull_request:
    branches: [main, feat/estrutura-base-clean-architecture, feat/v0.2-ux-contas-espacos-relatorios, feat/v0.3-orcamentos-projetos-cotacoes, feat/v0.4-backend-foundation, feat/v0.5-auth-frontend-supabase, feat/v0.6-email-otp-perfil, feat/v0.7-auth-api-espacos-online, feat/v0.8-sidebar-fixa-responsiva, feat/v0.9-sidebar-limpa-sem-scroll, feat/v0.10-menu-completo-mobile-drawer, feat/v0.11-tema-claro-preparacao-vercel]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes de regras financeiras
        run: npm run test
      - name: Validar tipos e gerar build
        run: npm run build

  validar-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: farol
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U farol -d farol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://farol:ci_password@localhost:5433/farol?schema=public
      SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar backend
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Validar modelo Prisma
        working-directory: backend
        run: npx prisma validate
      - name: Aplicar migração inicial em PostgreSQL temporário
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Verificar RLS em todas as tabelas
        working-directory: backend
        run: npx tsx scripts/check-rls.ts
      - name: Testes da API
        working-directory: backend
        run: npm run test
      - name: Build TypeScript
        working-directory: backend
        run: npm run build

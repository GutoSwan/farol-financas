name: Validar Farol Finanças
on:
  push:
    branches:
      - feat/estrutura-base-clean-architecture
      - feat/v0.2-ux-contas-espacos-relatorios
      - feat/v0.3-orcamentos-projetos-cotacoes
      - feat/v0.4-backend-foundation
      - main
  pull_request:
    branches: [main, feat/estrutura-base-clean-architecture, feat/v0.2-ux-contas-espacos-relatorios, feat/v0.3-orcamentos-projetos-cotacoes]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes de regras financeiras
        run: npm run test
      - name: Validar tipos e gerar build
        run: npm run build

  validar-backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://farol:ci_password@localhost:5433/farol?schema=public
      SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar backend
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Validar modelo Prisma
        working-directory: backend
        run: npx prisma validate
      - name: Testes da API
        working-directory: backend
        run: npm run test
      - name: Build TypeScript
        working-directory: backend
        run: npm run build

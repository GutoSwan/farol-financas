name: Validar Farol Finanças
# Agendamento só começa a executar após este arquivo estar na branch padrão.
on:
  schedule:
    # Horário alternativo ao começo da hora para reduzir atrasos do GitHub.
    - cron: '43 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - feat/estrutura-base-clean-architecture
      - feat/v0.2-ux-contas-espacos-relatorios
      - feat/v0.3-orcamentos-projetos-cotacoes
      - feat/v0.4-backend-foundation
      - feat/v0.5-auth-frontend-supabase
      - feat/v0.6-email-otp-perfil
      - feat/v0.7-auth-api-espacos-online
      - feat/v0.8-sidebar-fixa-responsiva
      - feat/v0.9-sidebar-limpa-sem-scroll
      - feat/v0.10-menu-completo-mobile-drawer
      - feat/v0.11-tema-claro-preparacao-vercel
      - feat/v0.13-api-postgres-nuvem
      - fix/v0.13-vercel-fastify-entry
      - feat/v0.12-login-redireciona-dashboard
      - fix/v0.13-vercel-fastify-404
      - fix/v0.13-fastify-runtime-diagnostics
      - fix/v0.13-prisma-serverless-health
      - fix/v0.13-pin-node-22-vercel
      - feat/frontend-preview-auth-api-20261104
      - 'security/**'
      - main
  pull_request:
    branches: [main, 'security/**', feat/estrutura-base-clean-architecture, feat/v0.2-ux-contas-espacos-relatorios, feat/v0.3-orcamentos-projetos-cotacoes, feat/v0.4-backend-foundation, feat/v0.5-auth-frontend-supabase, feat/v0.6-email-otp-perfil, feat/v0.7-auth-api-espacos-online, feat/v0.8-sidebar-fixa-responsiva, feat/v0.9-sidebar-limpa-sem-scroll, feat/v0.10-menu-completo-mobile-drawer, feat/v0.11-tema-claro-preparacao-vercel]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Execução única autorizada pelo usuário em 10/11/2026. Apenas chave PUBLICÁVEL Dev.
      # Remover este passo depois de obter os resultados; nunca agendar cadastros.
      - name: QA único - duas caixas descartáveis, login, TOTP e isolamento
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/security/v0.23-ephemeral-mail-e2e' && github.event.head_commit.message == 'run(liveqa): disposable signups' }}
        timeout-minutes: 4
        env:
          CI: 'true'
          FAROL_QA_EPHEMERAL_RUN: yes-once
          FAROL_QA_TARGET_PROJECT: tvirkrjkgdtybtcundon
          FAROL_QA_PUBLIC_KEY: 'sb_publishable_QRaiASY7ylKSExCYrLWvKw_ng9ypHgY'
        run: |
          node --check scripts/qa-disposable-live-e2e.mjs
          node scripts/qa-disposable-live-e2e.mjs
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testes da checagem pública (rede simulada)
        run: node --test scripts/verify-public-health.test.mjs
      - name: Testes de segurança do QA real (sem acessar Supabase)
        run: node --test scripts/qa-real-auth-guards.test.mjs
      - name: Conferir sintaxe do roteiro de teste real
        run: node --check scripts/qa-real-auth-e2e.mjs
      - name: Testes de regras financeiras
        run: npm run test
      - name: Validar tipos e gerar build
        run: npm run build

  validar-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: farol
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U farol -d farol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgresql://farol:ci_password@localhost:5433/farol?schema=public
      SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Validar modelo Prisma
        working-directory: backend
        run: npx prisma validate
      - name: Aplicar migração inicial em PostgreSQL temporário
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Verificar RLS em todas as tabelas
        working-directory: backend
        run: npx tsx scripts/check-rls.ts
      - name: Testar RLS com identidade artificial em PostgreSQL temporário (ROLLBACK)
        working-directory: backend
        run: npx tsx scripts/test-postgres-rls-isolation.ts
      - name: Testes da API
        working-directory: backend
        run: npm run test
      - name: Typecheck completo, incluindo scripts de segurança
        working-directory: backend
        run: npm run typecheck
      - name: Build TypeScript
        working-directory: backend
        run: npm run build

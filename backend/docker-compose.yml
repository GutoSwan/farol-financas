services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: farol
      POSTGRES_PASSWORD: farol_local_dev
      POSTGRES_DB: farol
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - farol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farol -d farol"]
      interval: 5s
      retries: 10
volumes:
  farol_pgdata:
